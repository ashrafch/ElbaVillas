<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elba Luce Villas · Render del progetto</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: clamp(20px, 5vw, 72px); background: #f7f1e7; color: #172522; font: 15px/1.55 system-ui, sans-serif; }
  main { max-width: 1180px; margin: auto; }
  h1 { margin: 0 0 28px; font: 500 clamp(35px, 5vw, 56px)/1.1 "Cormorant Garamond", Georgia, serif; }
  .frames { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 18px; }
  figure { margin: 0; }
  img { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  figcaption { margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1>Dal paesaggio agli interni</h1>
  <div class="frames">
    <figure><img src="../public/images/progetto/costa-elba.webp" alt="Ripresa aerea della costa dell’Elba"><figcaption>La costa dell’Elba</figcaption></figure>
    <figure><img src="../public/images/progetto/ville-render.webp" alt="Render di ville su più quote con coperture in coppi"><figcaption>Render delle ville</figcaption></figure>
    <figure><img src="../public/images/progetto/dettaglio-pergolato.webp" alt="Render di una loggia con pergolato e pietra"><figcaption>Logge e materiali</figcaption></figure>
    <figure><img src="../public/images/progetto/primo-piano-render.webp" alt="Render assonometrico del primo piano arredato"><figcaption>Il primo piano arredato</figcaption></figure>
  </div>
</main>
</body>
</html>
