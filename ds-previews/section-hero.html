<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elba Luce Villas · Masterplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; color: #f7f0df; background: #13231d; font: 14px/1.5 system-ui, sans-serif; }
  .hero { position: relative; isolation: isolate; min-height: 680px; height: 100svh; overflow: hidden; }
  .hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .hero::after { content: ""; z-index: -1; position: absolute; inset: 0; background: linear-gradient(#0a1816b8, transparent 33%), linear-gradient(0deg, #0b1714ed, transparent 40%); }
  .hero picture { position: absolute; inset: 0; z-index: -2; }
  header, .label, .bottom { position: absolute; left: max(28px, (100% - 1320px) / 2); right: max(28px, (100% - 1320px) / 2); display: flex; justify-content: space-between; gap: 18px; }
  header { top: 22px; align-items: center; }
  .brand { font: 500 26px "Cormorant Garamond", Georgia, serif; }
  .label { top: 86px; font-size: 11px; text-transform: uppercase; letter-spacing: .14em; }
  .bottom { bottom: 32px; align-items: flex-end; }
  h1 { margin: 0; font: 500 clamp(49px, 7vw, 108px)/.88 "Cormorant Garamond", Georgia, serif; letter-spacing: -.055em; }
  h1 em { color: #ebd5ae; }
  p { margin: 12px 0 0; }
  .panel { width: min(390px, 100%); padding: 15px; border: 1px solid #f7f0df48; background: #10231de8; backdrop-filter: blur(12px); }
  .panel p { margin: 0 0 10px; font-size: 13px; }
  .holder { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 3px; }
  .holder span, .pin { display: grid; place-items: center; height: 39px; border: 1px solid #f7f0df48; font-size: 11px; }
  .pin { position: absolute; left: var(--x); top: var(--y); height: 38px; width: 38px; transform: translate(-50%, -50%); border-radius: 50%; background: #172922e8; box-shadow: 0 1px 13px #06120e70; font-weight: 600; }
  .pin::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid #f7f0df5a; }
  .action { display: inline-block; margin-top: 12px; color: #f3ddb5; text-decoration: underline; text-underline-offset: 5px; }
  @media (max-width: 780px) {
    header, .label, .bottom { left: 16px; right: 16px; }
    .bottom { flex-direction: column; align-items: stretch; bottom: 19px; }
    .panel { width: 100%; }
    .pin { display: none; }
  }
</style>
</head>
<body>
  <main class="hero">
    <picture>
      <source media="(max-width: 780px)" srcset="../public/masterplan/overview-mobile.jpg">
      <img src="../public/masterplan/overview.jpg" alt="Vista aerea delle nove ville affacciate sul mare">
    </picture>
    <header><span class="brand">Elba Luce Villas</span></header>
    <div class="label"><span>Masterplan interattivo</span><span>Prototipo architettonico</span></div>
    <div aria-hidden="true">
      <span class="pin" style="--x:29.5%;--y:41%">01</span>
      <span class="pin" style="--x:45.5%;--y:53.2%">02</span>
      <span class="pin" style="--x:66.5%;--y:62.2%">03</span>
      <span class="pin" style="--x:38.5%;--y:25.2%">04</span>
      <span class="pin" style="--x:53.8%;--y:32.8%">05</span>
      <span class="pin" style="--x:72.4%;--y:38.3%">06</span>
      <span class="pin" style="--x:43.7%;--y:10.3%">07</span>
      <span class="pin" style="--x:58.6%;--y:16.1%">08</span>
      <span class="pin" style="--x:76.3%;--y:20.1%">09</span>
    </div>
    <div class="bottom">
      <div>
        <h1>Nove ville,<br><em>un solo orizzonte.</em></h1>
        <p>Residenze bifamiliari tra mare e macchia mediterranea, all’Isola d’Elba.</p>
      </div>
      <div class="panel">
        <p>Scorri per entrare o scegli una villa.</p>
        <div class="holder"><span>01</span><span>02</span><span>03</span><span>04</span><span>05</span><span>06</span><span>07</span><span>08</span><span>09</span></div>
        <span class="action">Inizia la visita</span>
      </div>
    </div>
  </main>
</body>
</html>
